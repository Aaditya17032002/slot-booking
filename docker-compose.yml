services:
  usvisa-monitor:
    image: docker.io/aditya17032002/us-visa-monitor:latest
    build: .
    container_name: usvisa-monitor
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      BROWSER_MODE: cdp
      HEADLESS: "false"
      CDP_PORT: "9222"
      NOTIFY_EVERY_CHECK: "true"
      DISPLAY: ":99"
      USVISA_USERNAME: ${USVISA_USERNAME}
      USVISA_PASSWORD: ${USVISA_PASSWORD}
      SECURITY_A_PET: ${SECURITY_A_PET}
      SECURITY_A_FOOD: ${SECURITY_A_FOOD}
      SECURITY_A_WORK: ${SECURITY_A_WORK}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CONSULATES: ${CONSULATES:-Kolkata,Mumbai}
      VISA_CATEGORY: ${VISA_CATEGORY:-B1/B2}
      VISA_TYPE: ${VISA_TYPE:-Regular}
    volumes:
      - usvisa-profile:/app/browser_profile
      - usvisa-data:/app/data

volumes:
  usvisa-profile:
  usvisa-data:
